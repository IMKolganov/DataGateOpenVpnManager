port 1295
proto tcp
dev ovpn-udp
dev-type tun


ca /etc/openvpn/ca.crt
cert /etc/openvpn/server.crt
key /etc/openvpn/server.key
dh none
tls-groups prime256v1

topology subnet
server 10.50.28.0 255.255.255.0
ifconfig-pool-persist /etc/openvpn/ipp.txt

push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 9.9.9.9"
push "block-outside-dns"
push "redirect-gateway def1"
push "mssfix 1200"

keepalive 15 120

remote-cert-tls client
tls-version-min 1.3
tls-crypt /etc/openvpn/ta.key

data-ciphers AES-128-GCM:AES-256-GCM:CHACHA20-POLY1305
cipher AES-128-GCM
auth SHA512

user nobody
group nogroup

persist-key
persist-tun

crl-verify /openvpn-udp/easy-rsa/pki/crl.pem

status /openvpn-udp/openvpn-status.log
status-version 3
log /openvpn-udp/openvpn.log
log-append /openvpn-udp/openvpn.log
syslog

management 127.0.0.1 5095

script-security 2
setenv API_PORT 5009
setenv API_HOST 127.0.0.1
client-connect /etc/openvpn/scripts/client-connect.sh
client-disconnect /etc/openvpn/scripts/client-disconnect.sh
learn-address /etc/openvpn/scripts/learn-address.sh
tls-verify /etc/openvpn/scripts/tls-verify.sh

verb 4
