port 1194
proto udp
dev tun
disable-dco

ca /etc/openvpn/ca.crt
cert /etc/openvpn/server.crt
key /etc/openvpn/server.key
dh none
tls-groups prime256v1

topology subnet
server 10.51.28.0 255.255.255.0
ifconfig-pool-persist /etc/openvpn/ipp.txt

push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"
push "block-outside-dns"
push "redirect-gateway def1"


keepalive 15 120

remote-cert-tls client
tls-version-min 1.2
tls-crypt /etc/openvpn/ta.key

cipher AES-256-CBC
auth SHA256

user nobody
group nogroup

persist-key
persist-tun

crl-verify /mnt/easy-rsa/pki/crl.pem

status /mnt/openvpn-status.log
status-version 3
log /mnt/openvpn.log
log-append /mnt/openvpn.log
syslog

management 127.0.0.1 5092

script-security 2
setenv API_PORT 5010
setenv API_HOST 127.0.0.1
client-connect /etc/openvpn/scripts/client-connect.sh
client-disconnect /etc/openvpn/scripts/client-disconnect.sh
learn-address /etc/openvpn/scripts/learn-address.sh
tls-verify /etc/openvpn/scripts/tls-verify.sh

verb 4
